# Gradle must run on JDK 17–23 (not Java 25). Set Gradle JDK in Android Studio:
# Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK → jbr-21 or 17
# Or uncomment and set a JDK 17/21 path (Windows example):
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1

